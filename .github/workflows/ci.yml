name: ROBOLENS CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-workers:
    name: Backend & Worker Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx opencv-python-headless

      - name: Run Backend & AI Worker Pytest Suite
        run: |
          python -m pytest -c backend/pytest.ini backend/tests -v

  mobile-lint:
    name: Flutter Mobile Verification & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Project Structure
        run: |
          cd mobile
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Run Flutter Tests
        run: |
          cd mobile
          flutter test

  build-android-apk:
    name: Build Android Native APK
    runs-on: ubuntu-latest
    needs: [backend-and-workers]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Debug APK
        run: |
          cd mobile
          flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: robolens-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
