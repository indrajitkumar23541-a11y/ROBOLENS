name: ROBOLENS CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-workers:
    name: Backend & Worker Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx opencv-python-headless

      - name: Run Backend & AI Worker Pytest Suite
        run: |
          python -m pytest -c backend/pytest.ini backend/tests -v

  mobile-lint:
    name: Flutter Mobile Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Project Structure
        run: |
          cd mobile
          test -f pubspec.yaml
          test -f lib/main.dart
