services:
  # ---------------------------------------------------------------------------
  # Primary Database: PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: robolens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robolens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robolens_password}
      POSTGRES_DB: ${POSTGRES_DB:-robolens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robolens_user} -d ${POSTGRES_DB:-robolens}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache & Rate Limiting: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: robolens-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # S3-Compatible Object Storage: MinIO
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: robolens-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Web Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Bucket Auto-initializer
  minio-init:
    image: minio/mc:latest
    container_name: robolens-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_RAW:-robolens-raw-media};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_PROCESSED:-robolens-processed-media};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_DATASETS:-robolens-datasets};
      echo 'All MinIO buckets successfully initialized!';
      exit 0;
      "

  # ---------------------------------------------------------------------------
  # Workflow Orchestration: Temporal Dev Server
  # ---------------------------------------------------------------------------
  temporal:
    image: temporalio/dev-server:1.24.1
    container_name: robolens-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"   # Temporal gRPC API
      - "8233:8233"   # Temporal Web UI
    volumes:
      - temporal-data:/tmp/temporal

volumes:
  postgres-data:
  redis-data:
  minio-data:
  temporal-data:
